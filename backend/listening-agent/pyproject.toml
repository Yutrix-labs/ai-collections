[project]
name = "listening-agent"
version = "0.1.0"
description = "Standalone silent transcriber agent for LiveKit multi-speaker transcription"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents[deepgram,silero]~=1.2",
    "python-dotenv>=1.2.1",
    "aiohttp>=3.9",
    "anthropic>=0.49",
    "openai>=2.11.0",
    "boto3>=1.42.49",
    "google-cloud-aiplatform>=1.72.0",
    "cerebras-cloud-sdk>=1.0.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "silent_transcriber_agent",
    "insight_engine",
    "call_flow_loader",
    "copilot_schema",
    "sip_mobile_extractor",
    "toon_util",
    "egress_manager",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.uv]
package = true

[project.scripts]
listening-agent = "silent_transcriber_agent:main"
