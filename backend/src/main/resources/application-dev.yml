spring:
  ai:
    bedrock:
      aws:
        region: ${AWS_REGION}
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
    openai:
      api-key: ${CEREBRAS_API_KEY}
      base-url: https://api.cerebras.ai
      chat:
        options:
          model: gpt-oss-120b
    vertex:
      ai:
        gemini:
          project-id: ${GCP_PROJECT_ID}
          location: ${GCP_LOCATION}

server:
  port: 8080
  servlet:
    context-path: /collassistantapi

exotel:
  subdomain: api.in.exotel.com
  account-sid: ${EXOTEL_ACCOUNT_SID:fintaar2m}
  auth-key: ${EXOTEL_AUTH_KEY}
  auth-token: ${EXOTEL_AUTH_TOKEN}
  caller-id: ${EXOTEL_CALLER_ID:02247790125}

livekit:
  url: wss://mohan-joshi-e2t1b6ty.livekit.cloud
  api-key: APIg7kR5wWGojGk
  api-secret: Wef12WTOTsFYxDQnOpXjUZgzX8cGrJH9AwnjYwNhXjb
  # Must match the worker's AGENT_NAME env (backend/listening-agent/.env).
  agent-name: silent-transcriber

# Telephony mode: "tata" (Smartflo click-to-call → VOICE Bot WebSocket), "exotel" (legacy SIP),
# or "livekit" (browser-to-browser, no telephony). Default stays livekit — flip to tata via the
# CALL_MODE env/Vault when the ws-bridge is deployed and the Tata portal points at it.
call:
  mode: ${CALL_MODE:tata}

# Tata Smartflo "Click to Call Support" — customer-first: Tata rings the customer, then routes the
# answered call to the VOICE Bot pre-configured against this api-key in the portal. That VOICE Bot
# is the ws_telephony_bridge WebSocket URL.
#
# IMPORTANT for the server: the WebSocket URL lives in the TATA PORTAL, not here. For this to work
# on the server, the portal's VOICE Bot must point at the deployed bridge
# (wss://aiassistant.yutrix.io/telephony/stream/...), NOT at a local ngrok URL — otherwise Tata
# streams the audio to a laptop that can't see the server's session. See k8s/ws-bridge/.
tata:
  api-url: ${TATA_API_URL:https://api-smartflo.tatateleservices.com/v1/click_to_call_support}
  # Sent in the request BODY as `api_key` (not an Authorization header). Selects the destination.
  # Prefer supplying via Vault (TATA_API_KEY); the default is the shared demo key.
  api-key: ${TATA_API_KEY:cfa57cb3-932b-44bc-84ed-9238f15fb5bc}
  caller-id: ${TATA_CALLER_ID:}
  call-timeout: ${TATA_CALL_TIMEOUT:}
  customer-ring-timeout: ${TATA_CUSTOMER_RING_TIMEOUT:}

app:
  cors:
    allowed-origins: https://aiassistant.yutrix.io
  # Writable copy of the customer dataset. PTP predictions are cached back here so
  # the model is only called once per account (see PtpPredictionService.getOrPredict).
  # Relative to the backend module dir when running `./mvnw spring-boot:run`.
  customers-file: src/main/resources/data/customers.json

next-action:
  api-url: https://cep.yutrix.io/nextactionapi/V1/analyse/ai-assistant-analyze

ptp:
  model:
    # FastAPI PTP-fulfillment model service, reached over cluster-internal DNS.
    # Overridable via PTP_MODEL_API_URL env var.
    api-url: ${PTP_MODEL_API_URL:http://ml-ptp.app-services.svc.cluster.local:8000}

logging:
  level:
    labs.yutrix.uw: DEBUG
    org.springframework.web.socket: DEBUG
