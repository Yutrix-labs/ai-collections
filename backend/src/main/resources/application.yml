spring:
  ai:
    bedrock:
      aws:
        region: ap-south-1
        access-key: dev-placeholder
        secret-key: dev-placeholder
    openai:
      api-key: csk-cyjfp96x4f8t8ry4rk9kvrkhr2mymvhpc5dp4e5mc53dk3tx
      base-url: https://api.cerebras.ai
      chat:
        options:
          model: gpt-oss-120b
    vertex:
      ai:
        gemini:
          project-id: dev-placeholder
          location: dev-placeholder
  # SMTP for sending the customer their LiveKit join link. Credentials come from env
  # (MAIL_USERNAME / MAIL_PASSWORD via Vault) — never commit the Gmail app password.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp
    # Don't hang the request thread forever if Gmail is unreachable.
    connect-timeout: 8000
    timeout: 8000
    write-timeout: 8000

server:
  port: 8080
  servlet:
    context-path: /collassistantapi

exotel:
  subdomain: api.in.exotel.com
  account-sid: fintaar2m
  auth-key: d842fcade85285ab94b01b5769e84aadce61ae656320f2e1
  auth-token: 5102f8bd375bce451f009c4b98a1fdad6fd83386c69eba75
  caller-id: 02247790125

# CRITICAL: these MUST match backend/listening-agent/.env exactly — same LiveKit project AND the
# same agent name. If the project differs, the backend mints tokens for one project while the
# worker/bridge live in another (agent and customer never meet). If agent-name differs, the
# dispatch never reaches the worker and nothing is transcribed. Both are silent failures.
# Currently aligned to .env: testing-agents-hojyo1b2 (India West) / AGENT_NAME=agent-local.
livekit:
  url: ${LIVEKIT_URL:wss://testing-agents-hojyo1b2.livekit.cloud}
  api-key: ${LIVEKIT_API_KEY:APIRa6rA4b5k4bz}
  api-secret: ${LIVEKIT_API_SECRET:X3f6HNt4FSf2V3TRQ3abraOVr702r0gim1eZIJbslbcB}
  # Must equal the worker's AGENT_NAME env (backend/listening-agent/.env).
  agent-name: ${LIVEKIT_AGENT_NAME:agent-local}

# Telephony mode: "exotel" (Click2Call/SIP), "tata" (Smartflo click-to-call over WebSocket),
# or "livekit" (browser-to-browser WebRTC, no telephony). Override via CALL_MODE.
call:
  mode: ${CALL_MODE:tata}

# Tata Smartflo "Click to Call Support" (used when call.mode=tata) — full Exotel replacement.
# https://docs.smartflo.tatatelebusiness.com/reference/v1click_to_call_support
# Customer-first: Tata rings the customer, then routes the answered call to the VOICE Bot that is
# pre-configured against this api-key in the portal (API Connect → Click to Call Support API →
# Destinations → VOICE Bot). That VOICE Bot is the ws_telephony_bridge WebSocket URL — so the WS URL
# is configured in the PORTAL, not here and not per call.
tata:
  api-url: ${TATA_API_URL:https://api-smartflo.tatateleservices.com/v1/click_to_call_support}
  # Sent in the request BODY as `api_key` (not an Authorization header). Selects the destination.
  api-key: ${TATA_API_KEY:cfa57cb3-932b-44bc-84ed-9238f15fb5bc}
  # Optional DID shown to the customer (e.g. 9180694XXXXX). Blank => portal default.
  caller-id: ${TATA_CALLER_ID:}
  # Optional: auto-disconnect after N seconds. Blank => not sent.
  call-timeout: ${TATA_CALL_TIMEOUT:}
  # Optional: customer ring duration, 10-30s (Tata default 30). Blank => not sent.
  customer-ring-timeout: ${TATA_CUSTOMER_RING_TIMEOUT:}
  # Call Detail Records — used post-call to fetch the recording URL by callSid.
  # records-auth-token is the portal "API Token" (JWT), SEPARATE from the click-to-call api-key.
  # Blank => recording fetch is skipped (callRecordingURL stays null).
  records-api-url: ${TATA_RECORDS_API_URL:https://api-smartflo.tatateleservices.com/v1/call/records}
  # Vault-only (tata_records_auth_token in the backend Vault secret — the k8s template injects it).
  records-auth-token: ${TATA_RECORDS_AUTH_TOKEN:}
  records-auth-scheme: ${TATA_RECORDS_AUTH_SCHEME:Bearer}

app:
  # Shared API key required on all REST endpoints (X-API-KEY header) and the STOMP CONNECT frame.
  # Blank => auth disabled (local dev / first deploy before the Vault secret exists). Set via APP_API_KEY.
  api-key: ${APP_API_KEY:}
  cors:
    # Comma-separated browser origins allowed for REST + WebSocket. Override via APP_CORS_ALLOWED_ORIGINS.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  # Writable copy of the customer dataset. PTP predictions are cached back here so
  # the model is only called once per account (see PtpPredictionService.getOrPredict).
  # Relative to the backend module dir when running `./mvnw spring-boot:run`.
  customers-file: src/main/resources/data/customers.json

next-action:
  api-url: http://localhost:8082/nextactionapi/V1/analyse/ai-assistant-analyze
  # api-url: https://cep.yutrix.io/nextactionapi/V1/analyse/ai-assistant-analyze

ptp:
  model:
    # FastAPI PTP-fulfillment model service (backend/ml-ptp). Run with: uv run ptp-serve
    api-url: http://localhost:8000

management:
  health:
    # The mail health indicator opens an SMTP connection to Gmail on every /actuator/health call.
    # The k8s readiness probe hits /actuator/health, so if the cluster can't reach smtp.gmail.com:587
    # the pod never becomes ready. Email sending is unaffected by this — only the health check is.
    mail:
      enabled: false

logging:
  level:
    labs.yutrix.uw: DEBUG
    org.springframework.web.socket: DEBUG
