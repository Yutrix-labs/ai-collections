app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001
  # Writable copy of the customer dataset. PTP predictions are cached back here so
  # the model is only called once per account (see PtpPredictionService.getOrPredict).
  # Relative to the backend module dir when running `./mvnw spring-boot:run`.
  customers-file: src/main/resources/data/customers.json
  # Public origin of this backend as reachable by the customer's email client/browser.
  # The gated join link is built as {public-base-url}{context-path}/call/join/{token}.
  # In prod set this to the externally reachable host (e.g. https://cep.yutrix.io).
  # public-base-url: http://localhost:8080
  public-base-url: https://birectangular-albina-wearproof.ngrok-free.dev
  email:
