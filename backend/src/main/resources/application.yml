spring:
  ai:
    bedrock:
      aws:
        region: ap-south-1
        access-key: dev-placeholder
        secret-key: dev-placeholder
    openai:
      api-key: csk-cyjfp96x4f8t8ry4rk9kvrkhr2mymvhpc5dp4e5mc53dk3tx
      base-url: https://api.cerebras.ai
      chat:
        options:
          model: gpt-oss-120b
    vertex:
      ai:
        gemini:
          project-id: dev-placeholder
          location: dev-placeholder
  # SMTP for sending the customer their LiveKit join link. Credentials come from env
  # (MAIL_USERNAME / MAIL_PASSWORD via Vault) — never commit the Gmail app password.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp
    # Don't hang the request thread forever if Gmail is unreachable.
    connect-timeout: 8000
    timeout: 8000
    write-timeout: 8000

server:
  port: 8080
  servlet:
    context-path: /collassistantapi

exotel:
  subdomain: api.in.exotel.com
  account-sid: fintaar2m
  auth-key: d842fcade85285ab94b01b5769e84aadce61ae656320f2e1
  auth-token: 5102f8bd375bce451f009c4b98a1fdad6fd83386c69eba75
  caller-id: 02247790125

# NOTE: for the browser (livekit) call mode these MUST point to the same LiveKit project
# the listening-agent worker connects to (its .env), otherwise agent dispatch never reaches it.
livekit:
  url: wss://mohan-joshi-e2t1b6ty.livekit.cloud
  api-key: APIg7kR5wWGojGk
  api-secret: Wef12WTOTsFYxDQnOpXjUZgzX8cGrJH9AwnjYwNhXjb
  # Must match the worker's AGENT_NAME env (backend/listening-agent/.env).
  agent-name: silent-transcriber-dev

# Telephony mode: "exotel" (Click2Call/SIP), "tata" (Smartflo click-to-call over WebSocket),
# or "livekit" (browser-to-browser WebRTC, no telephony). Override via CALL_MODE.
call:
  mode: ${CALL_MODE:tata}

# Tata Smartflo click-to-call (used when call.mode=tata). Replaces exotel.* for the telephony
# trigger; audio is streamed to the bridge over WebSocket instead of a SIP trunk.
# CONFIRM api-url / auth / field names against your Tata onboarding docs.
tata:
  api-url: ${TATA_API_URL:https://api-smartflo.tatateleservices.com/v1/click_to_call}
  auth-token: ${TATA_AUTH_TOKEN:}
  auth-scheme: ${TATA_AUTH_SCHEME:Bearer}
  caller-id: ${TATA_CALLER_ID:}
  agent-number: ${TATA_AGENT_NUMBER:}
  stream-url-field: ${TATA_STREAM_URL_FIELD:ws_url}

# ws_telephony_bridge.py location. In tata mode the backend builds the bridge WS URL from this
# and hands it to Tata. For a demo, public-ws-base-url is your ngrok wss host.
bridge:
  public-ws-base-url: ${BRIDGE_PUBLIC_WS_BASE_URL:}
  auth-token: ${BRIDGE_AUTH_TOKEN:}

app:
  # Shared API key required on all REST endpoints (X-API-KEY header) and the STOMP CONNECT frame.
  # Blank => auth disabled (local dev / first deploy before the Vault secret exists). Set via APP_API_KEY.
  api-key: ${APP_API_KEY:}
  cors:
    # Comma-separated browser origins allowed for REST + WebSocket. Override via APP_CORS_ALLOWED_ORIGINS.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  # Writable copy of the customer dataset. PTP predictions are cached back here so
  # the model is only called once per account (see PtpPredictionService.getOrPredict).
  # Relative to the backend module dir when running `./mvnw spring-boot:run`.
  customers-file: src/main/resources/data/customers.json

next-action:
  api-url: http://localhost:8082/nextactionapi/V1/analyse/ai-assistant-analyze
  # api-url: https://cep.yutrix.io/nextactionapi/V1/analyse/ai-assistant-analyze

ptp:
  model:
    # FastAPI PTP-fulfillment model service (backend/ml-ptp). Run with: uv run ptp-serve
    api-url: http://localhost:8000

management:
  health:
    # The mail health indicator opens an SMTP connection to Gmail on every /actuator/health call.
    # The k8s readiness probe hits /actuator/health, so if the cluster can't reach smtp.gmail.com:587
    # the pod never becomes ready. Email sending is unaffected by this — only the health check is.
    mail:
      enabled: false

logging:
  level:
    labs.yutrix.uw: DEBUG
    org.springframework.web.socket: DEBUG
