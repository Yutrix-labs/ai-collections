[project]
name = "ptp-model"
version = "0.1.0"
description = "PTP (Promise-to-Pay) fulfillment probability model + FastAPI scoring service for AI Collections"
requires-python = ">=3.12,<3.13"
dependencies = [
    "scikit-learn>=1.5",
    "lightgbm>=4.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[project.scripts]
ptp-generate = "ptp_model.generate_data:main"
ptp-train = "ptp_model.train:main"
ptp-serve = "ptp_model.app:main"
