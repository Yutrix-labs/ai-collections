apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-collections
  namespace: app-services
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    konghq.com/plugins: rate-limiting,correlation-id
    # Long timeouts for STOMP WebSocket connections (milliseconds)
    konghq.com/connect-timeout: "60000"
    konghq.com/read-timeout: "3600000"
    konghq.com/write-timeout: "3600000"
spec:
  ingressClassName: kong
  tls:
    - hosts: [aiassistant.yutrix.io]
      secretName: ai-collections-tls
  rules:
    - host: aiassistant.yutrix.io
      http:
        paths:
          # Backend API + WebSocket (more specific — matched first)
          - path: /collassistantapi
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          # Frontend (catch-all)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
