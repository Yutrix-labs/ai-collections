name: Frontend CI/CD

on:
  push:
    branches: [v1.0.1.3]
    paths:
      - "frontend/**"
      - "k8s/frontend/**"
      - "k8s/ingress.yaml"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [master]
    paths:
      - "frontend/**"
  workflow_dispatch:

jobs:
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image reference
        id: image
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${REPO}/frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${REPO}/frontend:latest"         >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.ref == 'refs/heads/v1.0.1.3' && github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ steps.image.outputs.latest }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=registry,ref=${{ steps.image.outputs.latest }}
          cache-to: type=inline

  deploy:
    name: Deploy to K8s
    needs: build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/v1.0.1.3' && github.event_name == 'push'
    # GITHUB_TOKEN needs packages:read so the cluster pull secret can be refreshed from it.
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Pin image to SHA in manifest
        run: |
          sed -i "s|image: ghcr.io/yutrix-labs/ai-collections/frontend:.*|image: ${{ needs.build-push.outputs.image }}|" \
            k8s/frontend/deployment.yaml

      # Copy the (SHA-pinned) manifests to the VPS. We run kubectl ON the VPS over SSH because
      # GitHub-hosted runners can't reliably reach the k3s API on :6443 (i/o timeouts); locally
      # on the box the API is always reachable.
      - name: Copy manifests to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "k8s/frontend/peer-auth.yaml,k8s/frontend/authz-policy.yaml,k8s/frontend/deployment.yaml,k8s/ingress.yaml"
          target: "/tmp/ai-collections-frontend"
          overwrite: true

      - name: Apply on VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: GHCR_TOKEN
          script: |
            set -e
            cd /tmp/ai-collections-frontend
            # Refresh the GHCR pull secret so private images can be pulled (the previous token expired).
            kubectl -n app-services create secret docker-registry ghcr-pull-secret \
              --docker-server=ghcr.io \
              --docker-username=${{ github.actor }} \
              --docker-password="$GHCR_TOKEN" \
              --dry-run=client -o yaml | kubectl apply -f -
            kubectl apply -f k8s/frontend/peer-auth.yaml
            kubectl apply -f k8s/frontend/authz-policy.yaml
            kubectl apply -f k8s/frontend/deployment.yaml
            kubectl apply -f k8s/ingress.yaml
            kubectl -n app-services rollout status deployment/frontend --timeout=120s
