name: Listening Agent CI/CD

on:
  push:
    branches: [v1.0.1.3]
    paths:
      - "backend/listening-agent/**"
      - "k8s/listening-agent/**"
      - ".github/workflows/listening-agent.yml"
  pull_request:
    branches: [master]
    paths:
      - "backend/listening-agent/**"
  workflow_dispatch:

jobs:
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image reference
        id: image
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${REPO}/listening-agent:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${REPO}/listening-agent:latest"         >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/listening-agent/Dockerfile
          push: ${{ github.ref == 'refs/heads/v1.0.1.3' && github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ steps.image.outputs.latest }}
          cache-from: type=registry,ref=${{ steps.image.outputs.latest }}
          cache-to: type=inline

  deploy:
    name: Deploy to K8s
    needs: build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/v1.0.1.3' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Pin image to SHA in manifest
        run: |
          sed -i "s|image: ghcr.io/yutrix-labs/ai-collections/listening-agent:.*|image: ${{ needs.build-push.outputs.image }}|" \
            k8s/listening-agent/deployment.yaml

      - name: Deploy
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          echo "$KUBECONFIG_B64" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig

          # The k3s API server (6443) is intermittently slow to accept connections
          # from GitHub runners (occasional "dial tcp ...:6443: i/o timeout").
          # Retry each kubectl call a few times before failing the deploy.
          retry() {
            for attempt in 1 2 3 4 5; do
              if "$@"; then return 0; fi
              echo "::warning::kubectl attempt $attempt failed, retrying in 15s..."
              sleep 15
            done
            "$@"
          }

          retry kubectl apply --request-timeout=60s -f k8s/listening-agent/authz-policy.yaml
          retry kubectl apply --request-timeout=60s -f k8s/listening-agent/deployment.yaml
          retry kubectl rollout status deployment/listening-agent \
            --namespace app-services \
            --timeout=600s
