name: ML-PTP CI/CD

on:
  push:
    branches: [v1.0.1.3]
    paths:
      - "backend/ml-ptp/**"
      - "k8s/ml-ptp/**"
      - ".github/workflows/ml-ptp.yml"
  pull_request:
    branches: [master]
    paths:
      - "backend/ml-ptp/**"
  workflow_dispatch:

jobs:
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image reference
        id: image
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${REPO}/ml-ptp:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${REPO}/ml-ptp:latest"         >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend/ml-ptp
          push: ${{ github.ref == 'refs/heads/v1.0.1.3' && github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ steps.image.outputs.latest }}
          cache-from: type=registry,ref=${{ steps.image.outputs.latest }}
          cache-to: type=inline

  deploy:
    name: Deploy to K8s
    needs: build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/v1.0.1.3' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Pin image to SHA in manifest
        run: |
          sed -i "s|image: ghcr.io/yutrix-labs/ai-collections/ml-ptp:.*|image: ${{ needs.build-push.outputs.image }}|" \
            k8s/ml-ptp/deployment.yaml

      - name: Deploy
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          echo "$KUBECONFIG_B64" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig

          # Retry wrapper: the k3s API server on :6443 is occasionally
          # unreachable from GitHub-hosted runners (transient i/o timeout).
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "::warning::'$*' failed (attempt ${attempt}/3); retrying in 10s..."
              sleep 10
            done
            echo "::error::'$*' failed after 3 attempts"
            return 1
          }

          # --validate=false skips the client-side openapi schema download
          # (GET /openapi/v2), which was the call timing out against :6443.
          retry kubectl apply --validate=false -f k8s/ml-ptp/peer-auth.yaml
          retry kubectl apply --validate=false -f k8s/ml-ptp/authz-policy.yaml
          retry kubectl apply --validate=false -f k8s/ml-ptp/deployment.yaml
          retry kubectl rollout status deployment/ml-ptp \
            --namespace app-services \
            --timeout=300s
