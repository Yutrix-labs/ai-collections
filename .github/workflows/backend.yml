name: Backend CI/CD

on:
  push:
    branches: [v1.0.1.3]
    paths:
      - "backend/src/**"
      - "backend/pom.xml"
      - "backend/Dockerfile"
      - "k8s/backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [master]
    paths:
      - "backend/src/**"
      - "backend/pom.xml"
  workflow_dispatch:

jobs:
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image reference
        id: image
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${REPO}/backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${REPO}/backend:latest"         >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.ref == 'refs/heads/v1.0.1.3' && github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ steps.image.outputs.latest }}
          cache-from: type=registry,ref=${{ steps.image.outputs.latest }}
          cache-to: type=inline

  deploy:
    name: Deploy to K8s
    needs: build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/v1.0.1.3' && github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Pin image to SHA in manifest
        run: |
          sed -i "s|image: ghcr.io/yutrix-labs/ai-collections/backend:.*|image: ${{ needs.build-push.outputs.image }}|" \
            k8s/backend/deployment.yaml

      - name: Deploy to k3s
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          echo "$KUBECONFIG_B64" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig

          # The k3s API on :6443 occasionally drops a connection from a
          # GitHub-hosted runner. Retry transient kubectl failures a few times.
          kc() {
            local n=0
            until kubectl "$@"; do
              n=$((n + 1))
              if [ "$n" -ge 5 ]; then
                echo "kubectl $* failed after $n attempts" >&2
                return 1
              fi
              echo "kubectl $* failed (attempt $n), retrying in 10s..." >&2
              sleep 10
            done
          }

          # Idempotent, LONG-LIVED GHCR pull secret. Sourced from a durable PAT
          # (GHCR_PULL_TOKEN), NOT the ephemeral GITHUB_TOKEN — so kubelet can
          # pull private images at any time, not just for an hour after a deploy.
          kubectl -n app-services create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USER" \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client -o yaml > /tmp/ghcr-pull-secret.yaml
          kc apply -f /tmp/ghcr-pull-secret.yaml

          kc apply -f k8s/backend/peer-auth.yaml
          kc apply -f k8s/backend/authz-policy.yaml
          kc apply -f k8s/backend/deployment.yaml
          kc -n app-services rollout status deployment/backend --timeout=300s
